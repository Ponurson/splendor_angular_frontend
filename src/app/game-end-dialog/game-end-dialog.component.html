<h1 mat-dialog-title>Finished</h1>
<div mat-dialog-content>
    <p *ngFor="let player of ranking" [class.winner]="isWinner(player)">
        <span *ngIf="isWinner(player)">🏆 </span>
        {{player.playerName}}
        &mdash; {{player.points}} pts, {{cardCount(player)}} cards
    </p>
</div>
<div mat-dialog-actions>
    <a
            class="btn btn-primary" [mat-dialog-close]= true cdkFocusInitial
            routerLink="../home" >Ok</a>
</div>
